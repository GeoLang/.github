name: Rust release

on:
  workflow_call:
    inputs:
      cargo_package:
        description: Package passed to cargo build -p
        type: string
        required: true
      archive_files:
        description: Files or shell glob in target/<target>/release to put in the tar.gz
        type: string
        required: true
      archive_name:
        description: Prefix of the tar.gz and artifact name, followed by -<target>
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release -p ${{ inputs.cargo_package }} --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release -p ${{ inputs.cargo_package }} --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ inputs.archive_name }}-${{ matrix.target }}.tar.gz ${{ inputs.archive_files }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.archive_name }}-${{ matrix.target }}
          path: ${{ inputs.archive_name }}-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # docker/build-push-action uploads a *.dockerbuild build record that download-artifact cannot extract
          pattern: "!*.dockerbuild"
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*.tar.gz"
          generate_release_notes: true
